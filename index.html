<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏝️ Okinawa Family Trip 2026</title>

<style>

body{
margin:0;
font-family:"Microsoft JhengHei",sans-serif;
background:#f5fbff;
color:#1e293b;
}

.hero{
height:100vh;
background:
linear-gradient(
rgba(0,0,0,.35),
rgba(0,0,0,.45)
),
url('images/瀨長島.jpg');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

.hero h1{
font-size:4rem;
margin-bottom:10px;
}

.hero p{
font-size:1.4rem;
}

.badge{
display:inline-block;
background:rgba(255,255,255,.2);
padding:10px 18px;
border-radius:50px;
margin:5px;
}

.section{
max-width:1200px;
margin:auto;
padding:50px 20px;
}

.card{
background:white;
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.gallery{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.gallery img{
width:100%;
height:220px;
object-fit:cover;
border-radius:15px;
}

h2{
color:#0369a1;
}

</style>

</head>

<body>

<section class="hero">

<div>

<h1>🏝️ Okinawa Family Trip</h1>

<p>2026.11.21 - 11.25</p>

<div class="badge">👨‍👩‍👧‍👦 13位家人</div>
<div class="badge">🏖️ 5天4夜</div>
<div class="badge">🚐 包車旅行</div>

</div>

</section>

<section class="section">

<div class="card">

<h2>✈️ 航班資訊</h2>

<p>CI310｜09:45 起飛 → 12:15 抵達沖繩</p>

<p>JX302｜13:15 起飛 → 15:45 抵達沖繩</p>

<p>JX303｜16:45 起飛 → 17:35 抵達台中</p>

</div>

<div class="card">

<h2>📍 精選景點</h2>

<div class="gallery">

<div>
<img src="images/dmm_kariyushi_aquarium.jpg">
<p>DMM Kariyushi Aquarium</p>
</div>

<div>
<img src="images/美麗海水族館.jpg">
<p>美麗海水族館</p>
</div>

<div>
<img src="images/美國村.jpg">
<p>美國村</p>
</div>

<div>
<img src="images/波上宮.jpg">
<p>波上宮</p>
</div>

<div>
<img src="images/國際通.jpg">
<p>國際通</p>
</div>

<div>
<img src="images/瀨長島.jpg">
<p>瀨長島</p>
</div>

</div>

</div>

</section>

</body>

</html>
